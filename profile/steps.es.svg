<svg xmlns="http://www.w3.org/2000/svg" width="960" height="168" viewBox="0 0 960 168" role="img" aria-label="Tres pasos: pide un trabajo, ese oficio lo escribe, nombra el oficio que sigue.">
  <title>Tres pasos: pide un trabajo, ese oficio lo escribe, nombra el oficio que sigue.</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2AD4FF"/>
      <stop offset="1" stop-color="#FFBF00"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="288" height="144" rx="20" fill="#061018"/>
  <rect x="12" y="12" width="288" height="144" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="36" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFBF00" letter-spacing="1.5">01</text>
  <text x="36" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F4F7FB">Pide un trabajo</text>
  <rect x="336" y="12" width="288" height="144" rx="20" fill="#061018"/>
  <rect x="336" y="12" width="288" height="144" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="360" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFBF00" letter-spacing="1.5">02</text>
  <text x="360" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F4F7FB">Ese oficio</text>
  <text x="360" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F4F7FB">lo escribe</text>
  <rect x="660" y="12" width="288" height="144" rx="20" fill="#061018"/>
  <rect x="660" y="12" width="288" height="144" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="684" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFBF00" letter-spacing="1.5">03</text>
  <text x="684" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F4F7FB">Nombra el</text>
  <text x="684" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F4F7FB">oficio que sigue</text>
